#Simulation parameters
delta_clock: .1 #Simulation time step (ms)
seed: 3141774 #Use 0 for a random seed, Control seed: 3141774
t_steps: 2000 # use 10000 in normal sims, 2000 lowest sim time without errors 

# 0FFLINE & ONLINE RAMP EXPERIMENT PARAMS 
ramp_duration: 10000 # length of ramp experiment 
block_time: 2000 # used for offline ramp experiments 
offline_ramp_experiment: 1 # takes the block_time then scales for EACH simulation 
offline_ramp_weight: 'custom_v0d_rg_inh' # specified weight to scale for offline scaling 
online_ramp_experiment: 0 # taking t_step specified time scaling up DURING the simulation 
online_ramp_weight: 'custom_v0d_rg_inh' # specified weight to scale for online scaling 
# ======================================================


optimizing: 0 #Use 1 when running Bayesian optimization to find parameters
#Define disease progression
days_after_onset: 0 #Healthy = 0; P45 = 45; P63 = 63; P112 = 112
#Test exogenous intervention
synaptically_stabilized: 0 #0 = No; 1 = Yes
synaptic_compensation: 0 #0 = No; 1 = Yes
#Test endogenous synaptic effects between RC-MN
slow_syn_dyn: 0 #Use 1 to increase rise/decay times of excitatory synapses to RCs and inhibitory synapses to MNs
slow_syn_bias: 'none' #Use 'flx' for flexor side bias, 'ext' for extensor side bias, 'none' for no bias
#Add feedback
sim_fb_freq: 2.5 #Hz
#Use 1 to allow feedback to the relevant populations
fb_rg_flx: 0
fb_rg_ext: 0
fb_v2b: 0
fb_v1: 0
fb_1a_flx: 0
fb_1a_ext: 0

#Network parameters
freq_test: 1        #1 = 200/320; 2 = 400/640 - changing the tonic drive into the network. 
remove_inhibition: 0 #Use 1 to remove inhibition within the RG populations
remove_descending_drive: 0 #Use 1 to remove descending drive to interneuron populations downstream of the RG layer
rgs_connected: 1 #Use 0 to remove mutual inhibition between the RG populations
v1v2b_mn_connected: 1 #Use 0 to remove projections from V1/V2b pops to MNPs
v2a_mn_intact: 0 #Use 1 to preserve V2a and MN populations at P112


# LOW LOCOMOTION - CONTRALATERAL PROJECTIONS  
# connections of v0d - being excited by RG_Flx and inhibiting OPPOSITE RG_FLX 
# connections of v0v - RG_F exciting V2a. V2a exciting V0v. V0v contralaterally projecting and inhibiting inhib RG_Flx 
low_locomotion_v0d_right: 0
low_locomotion_v0d_left: 0

low_locomotion_v0v_right: 1
low_locomotion_v0v_left: 1

# HIGH LOCOMOTION - CONTRALATERAL PROJECTIONS  
# connections of v0d - being excited by RG_Flx and inhibiting OPPOSITE RG_FLX 
# connections of v0v - RG_F exciting V2a. V2a exciting V0v. V0v contralaterally projecting and inhibiting inhib RG_Flx 

# V0D SUBPOPULATION
high_locomotion_v0d_right: 0
high_locomotion_v0d_left: 0
# ======================

# V0V SUBPOPULATION
high_locomotion_v0v_right: 0 
high_locomotion_v0v_left: 0
# ======================


# V0C PROJECTIONS 
contralateral_projections_v0c_right: 0 # use 1 to create connections of v0c - flx to flx mnp , ext to ext mnp 
contralateral_projections_v0c_left: 0  # use 1 to create connections of v0c - flx to flx mnp , ext to ext mnp 
# ======================

# V3 PROPJECTIONS 
#contralateral_projections_v3_flx_left: 0 # use 1 to create connections of v3 flx - left RG_flx exciting V3_flx. V3_flx then excites Right RG_flx 
#contralateral_projections_v3_ext_left: 0 # use 1 to create connections of v3 ext - left RG_ext exciting V3_ext. V3_ext then excites Right RG_ext 
#contralateral_projections_v3_flx_right: 0 # use 1 to create connections of v3 flx - right RG_flx exciting V3_flx. V3_flx then excites left RG_flx 
#contralateral_projections_v3_ext_right: 0 # use 1 to create connections of v3 flx - right RG_flx exciting V3_flx. V3_flx then excites left RG_flx 
# ======================

ramp_experimental_v0v_weights: 0 # manipualting both v0v left and right weights viewing associated change. 
ramp_experimental_v0d_weights: 0 # manipualting both v0d left and right weights viewing associated change. 


#Data analysis parameters
calculate_balance: 0
chop_edges_amount: 5000
convstd_rate: 200
convstd_pca: 200
downsampling_convolved: 0
high_pass_filtered: false
PCA_components: 5
remove_mean: false
remove_silent: true
save_all_pops: 0 #Use 1 to save spike data from all neural populations, use 0 to save only MNP data
save_results: 1
smoothing_window: 50 #Ex. 50: 50*0.1=5ms time window
sync_regularity: 0

# Plot selection
isf_output: 1
membrane_potential_plot: 1
pca_plot: 1
phase_ordered_plot: 1
raster_plot: 0
rate_coded_plot: 1
spike_distribution_plot: 0
heatmap_recruitment_plot: 1 
